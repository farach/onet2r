on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or release tag to deploy. Tags matching v* rebuild the root release site."
        required: true
        default: main

name: pkgdown

permissions: read-all

concurrency:
  group: pkgdown-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  pkgdown-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Check reference index
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}

      - name: Build full site
        run: pkgdown::build_site(preview = FALSE, new_process = FALSE)
        shell: Rscript {0}

  pkgdown-deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0

      # Release tags rebuild the root site. Every other ref rebuilds /dev/.
      - name: Choose site target
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' DESCRIPTION)
          if [[ "$DEPLOY_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            git rev-parse -q --verify "refs/tags/$DEPLOY_REF" > /dev/null || {
              echo "::error::$DEPLOY_REF is not a tag"; exit 1; }
            [[ "v$version" == "$DEPLOY_REF" ]] || {
              echo "::error::Tag $DEPLOY_REF does not match DESCRIPTION version $version"; exit 1; }
            mode=release
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.9[0-9]{3}$ ]]; then
            mode=devel
          else
            echo "::notice::$DEPLOY_REF has release version $version. Push tag v$version to deploy the release site."
            echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "PKGDOWN_DEV_MODE=$mode" >> "$GITHUB_ENV"
          echo "Deploying $DEPLOY_REF (version $version) in pkgdown mode $mode"

      - if: env.SKIP_DEPLOY != 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        if: env.SKIP_DEPLOY != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - if: env.SKIP_DEPLOY != 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Configure git identity
        if: env.SKIP_DEPLOY != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy site
        if: env.SKIP_DEPLOY != 'true'
        run: pkgdown::deploy_to_branch(new_process = FALSE)
        shell: Rscript {0}
